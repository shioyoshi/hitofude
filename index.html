<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<title>一筆ずつ</title>
<style>
:root{--bg:#e4e7e8;--ink:#15191b;--sub:#6b7377;--line:#b9c0c3;--acc:#2f6b57;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111416;--ink:#e8ebec;--sub:#858d91;--line:#2b3236;--acc:#7fc4a8}}
:root[data-theme="dark"]{--bg:#111416;--ink:#e8ebec;--sub:#858d91;--line:#2b3236;--acc:#7fc4a8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;display:grid;place-items:center;padding:20px}
main{width:min(100%,1040px)}
.stage{position:relative;display:block;width:100%;aspect-ratio:4/3;border:1.5px dashed var(--line);cursor:pointer;display:grid;place-items:center;overflow:hidden}
.stage.has{border:none;aspect-ratio:auto;cursor:default;display:block}
.stage.drag{border-color:var(--acc)}
.pick{background:none;border:0;font:inherit;cursor:pointer;display:grid;justify-items:center;gap:18px;color:var(--sub);font-size:15px;letter-spacing:.12em}
.stage.has .pick{display:none}
.pick small{font-size:12px;letter-spacing:.06em;opacity:.8}
.pick svg{width:96px;height:96px}
canvas{display:none;width:100%;height:auto;max-height:78vh;object-fit:contain;margin:0 auto}
.stage.has canvas{display:block}
.big{position:absolute;inset:0;display:none;place-items:center;background:none;border:0;cursor:pointer}
.big span{width:88px;height:88px;border-radius:50%;background:color-mix(in srgb,var(--bg) 82%,transparent);display:grid;place-items:center;transition:transform .2s}
.big:hover span{transform:scale(1.07)}
.stage.has.ready .big{display:grid}
.bar{display:none;align-items:center;gap:16px;margin-top:14px}
.stage.has~.bar{display:flex}
button{font:inherit;color:var(--ink)}
.btn{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--ink);background:none;display:grid;place-items:center;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn:hover svg{fill:var(--bg);stroke:var(--bg)}
.btn svg{width:18px;height:18px;fill:var(--ink);stroke:var(--ink)}
.ic{width:36px;height:36px;border:0;background:none;cursor:pointer;display:grid;place-items:center;flex:none;opacity:.7}
.ic:hover{opacity:1}
.ic svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.6}
button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.segs{flex:1;display:flex;gap:10px;align-items:center}
.seg{flex:1;display:flex;align-items:center;gap:8px;opacity:.45;transition:opacity .3s}
.seg.on{opacity:1}
.seg i{flex:none;width:var(--d);height:var(--d);border-radius:50%;background:var(--ink)}
.seg b{flex:1;height:3px;background:var(--line);position:relative;overflow:hidden}
.seg b u{position:absolute;inset:0;background:var(--acc);transform-origin:left;transform:scaleX(0)}
.seg .d{flex:none;width:28px;display:grid;place-items:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="stage" id="stage">
 <button class="pick" type="button" id="pickbtn">
  <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="48" cy="48" r="44"/><circle cx="48" cy="48" r="26"/><circle cx="48" cy="48" r="12"/><circle cx="48" cy="48" r="4" fill="currentColor"/></svg>
  写真をえらぶ
  <small id="msg">写真は端末の外に出ません</small>
 </button>
 <canvas id="cv"></canvas>
 <button class="big" id="big" aria-label="再生" type="button"><span><svg viewBox="0 0 24 24" width="34" height="34"><path d="M7 4.5v15l12-7.5z" fill="var(--ink)"/></svg></span></button>
</div>
<input type="file" id="file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" tabindex="-1">
<div class="bar" id="bar">
 <button class="btn" id="play" aria-label="再生" type="button"><svg viewBox="0 0 24 24" id="pi"><path d="M7 4.5v15l12-7.5z"/></svg></button>
 <div class="segs" id="segs"></div>
 <button class="ic" id="swap" aria-label="別の写真" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17l6-5 4 3 3-2 5 4"/></svg></button>
 <button class="ic" id="save" aria-label="画像を保存" type="button"><svg viewBox="0 0 24 24"><path d="M12 4v11m-5-4l5 5 5-5M5 20h14"/></svg></button>
</div>
</main>
<script>
const RAD=[24,12,6,3,1.6],TH=[0,18,14,11,8],FR=[150,200,260,320,380],MAXD=1280;
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d",{willReadFrequently:true}),stage=$("stage");
let W,H,src,base="photo",S={li:0,strokes:null,si:0,play:false,done:false};
const PLAY='<path d="M7 4.5v15l12-7.5z"/>',PAUSE='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>',AGAIN='<path d="M12 5a7 7 0 1 0 7 7h-2.2a4.8 4.8 0 1 1-4.8-4.8V10l4-4-4-4v3z"/>';
const segs=$("segs");
RAD.forEach(r=>{const s=document.createElement("div");s.className="seg";s.innerHTML=`<span class="d"><i style="--d:${Math.max(5,r*.9)}px"></i></span><b><u></u></b>`;segs.appendChild(s)});
const segEls=[...segs.children];

/* ぼかし(3回の箱ぼかしでガウスに近似) */
function pass(s,d,n,m,es,ls,r){const k=2*r+1,cl=i=>i<0?0:i>=n?n-1:i;for(let l=0;l<m;l++){const o=l*ls;for(let c=0;c<3;c++){let sum=0;for(let i=-r;i<=r;i++)sum+=s[o+c+cl(i)*es];for(let i=0;i<n;i++){d[o+c+i*es]=sum/k;sum+=s[o+c+cl(i+r+1)*es]-s[o+c+cl(i-r)*es]}}}}
function blur(data,r){let a=data.slice(),b=data.slice();if(r<1)return a;for(let p=0;p<3;p++){pass(a,b,W,H,4,4*W,r);pass(b,a,H,W,4*W,4,r)}return a}

async function load(f){
 if(!f)return;let im;
 try{im=await createImageBitmap(f)}catch(e){
  try{im=await new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ng;i.src=r.result};r.onerror=ng;r.readAsDataURL(f)})}
  catch(e2){const m="この写真は開けませんでした(JPEG・PNG・WebPで試してください)";$("msg").textContent=m;try{if(stage.classList.contains("has"))alert(m)}catch(_){}return}}
 base=(f.name||"photo").replace(/\.[^.]*$/,'')||"photo";
 const iw=im.width,ih=im.height,k=Math.min(1,MAXD/Math.max(iw,ih));
 W=Math.round(iw*k);H=Math.round(ih*k);
 const t=document.createElement("canvas");t.width=W;t.height=H;const c=t.getContext("2d");c.drawImage(im,0,0,W,H);
 src=c.getImageData(0,0,W,H).data;cv.width=W;cv.height=H;if(im.close)im.close();
 reset();stage.classList.add("has","ready")}
function reset(){cancelAnimationFrame(S.raf);S={li:0,strokes:null,si:0,play:false,done:false};const g=blur(src,28);for(let i=3;i<g.length;i+=4)g[i]=255;ctx.putImageData(new ImageData(g,W,H),0,0);ui()}

/* 1層分の筆跡を計算 */
function build(li){
 const R=RAD[li],ref=blur(src,Math.round(R*.6)),can=ctx.getImageData(0,0,W,H).data;
 const lum=new Float32Array(W*H);for(let i=0;i<W*H;i++)lum[i]=.299*ref[i*4]+.587*ref[i*4+1]+.114*ref[i*4+2];
 const L=(x,y)=>lum[(y<0?0:y>=H?H-1:y)*W+(x<0?0:x>=W?W-1:x)];
 const df=(a,i,b,j)=>Math.hypot(a[i]-b[j],a[i+1]-b[j+1],a[i+2]-b[j+2]);
 const g=Math.max(2,Math.round(R)),out=[],step=Math.max(2,R*.9),minS=2,maxS=Math.ceil(R*6/step);
 for(let y0=0;y0<H;y0+=g)for(let x0=0;x0<W;x0+=g){
  let sum=0,n=0,best=-1,bx=0,by=0;
  for(let y=y0;y<Math.min(H,y0+g);y++)for(let x=x0;x<Math.min(W,x0+g);x++){const i=(y*W+x)*4,e=df(ref,i,can,i);sum+=e;n++;if(e>best){best=e;bx=x;by=y}}
  if(sum/n<=TH[li])continue;
  const i0=(by*W+bx)*4,col=[ref[i0],ref[i0+1],ref[i0+2]],pts=[[bx,by]];
  let x=bx,y=by,lx=0,ly=0;
  for(let s=1;s<=maxS;s++){
   const ix=x|0,iy=y|0;
   const gx=L(ix+1,iy-1)+2*L(ix+1,iy)+L(ix+1,iy+1)-L(ix-1,iy-1)-2*L(ix-1,iy)-L(ix-1,iy+1);
   const gy=L(ix-1,iy+1)+2*L(ix,iy+1)+L(ix+1,iy+1)-L(ix-1,iy-1)-2*L(ix,iy-1)-L(ix+1,iy-1);
   let dx=-gy,dy=gx;const m=Math.hypot(dx,dy);
   if(m<8){if(s==1){const a=Math.random()*Math.PI;dx=Math.cos(a);dy=Math.sin(a)}else{dx=lx;dy=ly}}else{dx/=m;dy/=m;if(lx*dx+ly*dy<0){dx=-dx;dy=-dy}}
   x+=dx*step;y+=dy*step;lx=dx;ly=dy;
   if(x<0||y<0||x>=W||y>=H)break;
   if(s>=minS){const j=((y|0)*W+(x|0))*4,t={0:col[0],1:col[1],2:col[2]};if(df(ref,j,t,0)>34||df(ref,j,can,j)<df(ref,j,t,0))break}
   pts.push([x,y])}
  const jb=(Math.random()-.5)*14;
  out.push({pts,R,col:col.map(v=>Math.max(0,Math.min(255,v+jb+(Math.random()-.5)*8)))})}
 for(let i=out.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[out[i],out[j]]=[out[j],out[i]]}
 return out}

function path(p,ox,oy){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0]+ox,q[1]+oy):ctx.moveTo(q[0]+ox,q[1]+oy));if(p.length==1)ctx.lineTo(p[0][0]+ox+.1,p[0][1]+oy)}
function stroke(s){
 ctx.lineCap=ctx.lineJoin="round";ctx.globalAlpha=1;
 ctx.strokeStyle=`rgb(${s.col.map(Math.round)})`;ctx.lineWidth=s.R*1.8;path(s.pts,0,0);ctx.stroke();
 if(s.R>=6&&s.pts.length>1){const a=s.pts[0],b=s.pts[s.pts.length-1],d=Math.hypot(b[0]-a[0],b[1]-a[1])||1,nx=-(b[1]-a[1])/d,ny=(b[0]-a[0])/d;
  for(let k=0;k<3;k++){const o=(Math.random()-.5)*s.R*1.4,v=(Math.random()<.5?-1:1)*(10+Math.random()*14);ctx.globalAlpha=.4;ctx.strokeStyle=`rgb(${s.col.map(c=>Math.max(0,Math.min(255,c+v)))})`;ctx.lineWidth=Math.max(1,s.R*.22);path(s.pts,nx*o,ny*o);ctx.stroke()}ctx.globalAlpha=1}}

function ui(){
 const ic=S.done?AGAIN:S.play?PAUSE:PLAY;$("pi").innerHTML=ic;$("play").setAttribute("aria-label",S.done?"もう一度":S.play?"一時停止":"再生");
 stage.classList.toggle("ready",!S.play&&!S.done&&S.li==0&&!S.strokes);
 segEls.forEach((e,i)=>{const f=S.done||i<S.li?1:i==S.li&&S.strokes?S.si/S.strokes.length:0;e.firstElementChild.nextElementSibling.firstElementChild.style.transform=`scaleX(${f})`;e.classList.toggle("on",S.done||i<=S.li&&(S.play||i<S.li||S.strokes))})}
function tick(){
 if(!S.play)return;const t0=performance.now();
 while(performance.now()-t0<13){
  if(!S.strokes){if(S.li>=RAD.length){S.done=true;S.play=false;break}S.strokes=build(S.li);S.si=0;S.per=Math.max(1,Math.ceil(S.strokes.length/FR[S.li]));break}
  let n=0;while(S.si<S.strokes.length&&n<S.per&&performance.now()-t0<13){stroke(S.strokes[S.si++]);n++}
  if(S.si>=S.strokes.length){S.strokes=null;S.li++}
  break}
 ui();if(S.play)S.raf=requestAnimationFrame(tick)}
function toggle(){if(S.done){reset()}S.play=!S.play;ui();if(S.play)S.raf=requestAnimationFrame(tick)}
$("play").onclick=$("big").onclick=e=>{e.preventDefault();toggle()};
$("file").onchange=e=>load(e.target.files[0]);
stage.addEventListener("click",e=>{if(!stage.classList.contains("has"))$("file").click()});
$("swap").onclick=()=>{S.play=false;$("file").value="";$("file").click()};
$("save").onclick=()=>cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=base+"-hitofude.png";a.click()});
stage.addEventListener("dragover",e=>{e.preventDefault();stage.classList.add("drag")});
stage.addEventListener("dragleave",()=>stage.classList.remove("drag"));
stage.addEventListener("drop",e=>{e.preventDefault();stage.classList.remove("drag");load(e.dataTransfer.files[0])});
</script>
</body>
</html>
